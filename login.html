<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Management System Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: #e6f0fa; /* soft medical blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-wrapper {
            background: #ffffff;
            width: 400px;
            border-left: 6px solid #0275d8; /* blue accent */
            padding: 40px 30px;
            border-radius: 6px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0275d8;
            margin-bottom: 30px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0275d8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #025aa5;
        }

        .msg {
            color: red;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .hospital-icon {
            display: block;
            margin: 0 auto 20px auto;
            width: 60px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png" alt="Hospital Icon" class="hospital-icon">

        <h2>Hospital Management Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="msg">
              {% for category, message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
